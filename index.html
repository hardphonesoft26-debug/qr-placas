<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4f46e5">
<title>Panel de QR</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2d;--mu:#6a708a;--bd:#e5e7f2;--ac:#4f46e5;--ac2:#7c3aed;--ok:#16a34a;--dg:#dc2626;--sh:0 8px 30px rgba(30,35,90,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1120;--card:#191c31;--tx:#eef0ff;--mu:#9aa1c4;--bd:#2a2e4d;--ac:#818cf8;--ac2:#a78bfa;--sh:0 8px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;line-height:1.2;margin:0}
h2{font-size:17px;margin:0}
.sub{color:var(--mu);margin:6px 0 0;font-size:15px}
/* login */
.login{min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brand{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;margin-bottom:18px;box-shadow:0 10px 26px rgba(79,70,229,.35)}
.brand svg{width:36px;height:36px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:22px;margin-top:24px;width:100%;max-width:400px;text-align:left}
/* fields */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--mu);font-size:12px;margin-top:5px}
input{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(99,102,241,.18)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:0 0 10px;cursor:pointer;user-select:none}
.chk input{width:20px;height:20px;padding:0;margin:0;accent-color:var(--ac);flex:none}
.err{color:var(--dg);font-size:13px;margin-top:6px;min-height:0}
.err.warn{color:#b45309}
input.bad{border-color:var(--dg)}
/* buttons */
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.btn.block{width:100%}
.btn.dg{color:var(--dg);border-color:transparent;background:transparent}
.btn.sm{padding:9px 14px;font-size:14px}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.stat b{display:block;font-size:28px;line-height:1.1;color:var(--ac)}
.stat span{color:var(--mu);font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.chead div{min-width:0;flex:1}
.chead h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id{font-size:12px;color:var(--mu)}
.pill{background:rgba(99,102,241,.12);color:var(--ac);font-weight:700;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.dest{background:rgba(99,102,241,.07);border:1.5px dashed rgba(99,102,241,.4);border-radius:14px;padding:12px;margin-bottom:12px}
.dest label{color:var(--ac)}
.dest input{background:var(--card)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .grow{flex:1;min-width:140px}
.qrlink{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--mu);word-break:break-all}
.qrlink span{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.qrlink mark{background:rgba(99,102,241,.18);color:var(--ac);font-weight:700;border-radius:6px;padding:1px 5px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,30,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.sheet{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:360px;text-align:center}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:inline-block;line-height:0;margin:14px 0 8px}
.qrbox svg{width:240px;height:auto;max-width:70vw}
.url{word-break:break-all;color:var(--mu);font-size:12px;margin-bottom:14px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
/* misc */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#161a2d;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--dg)}
.load,.center{display:grid;place-items:center;text-align:center;min-height:70vh}
.spin{width:38px;height:38px;border:4px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:r .8s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
@media (min-width:720px){#app{padding-top:36px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// === CONFIGURACIÓN ===
const DB = "https://qr-placas-default-rtdb.firebaseio.com";
const API_KEY = "AIzaSyDmikmWfGnUUj_0k_40gynbCOsHrqa55Vo";
// =====================

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl = u => { try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:' } catch (e) { return false } };
const okCode = c => /^[a-z0-9-]{1,60}$/.test(c);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const base = location.origin + location.pathname;
const qrUrl = l => base + '?c=' + l.code;
const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3m4 0v4h-4m-3-1v1m0-4v.01"/></svg>';
let session = null;
try { session = JSON.parse(localStorage.getItem('qrsession') || sessionStorage.getItem('qrsession') || 'null') } catch (e) {}

function toast(t, err) {
  const e = document.getElementById('toast');
  e.textContent = t; e.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => e.className = 'toast', 3000);
}

/* ---------- sesión ---------- */
async function idToken() {
  if (!session) throw new Error('sin sesion');
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(session.refresh)
  });
  const d = await r.json();
  if (!d.id_token) throw new Error('sesion vencida');
  return d.id_token;
}
async function login(email, pw, remember) {
  let d;
  try {
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API_KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw, returnSecureToken: true })
    });
    d = await r.json();
  } catch (e) { return { ok: false, msg: 'Sin conexión. Revisa tu internet e inténtalo de nuevo.' } }
  if (!d.refreshToken) {
    const c = (d.error && d.error.message) || '';
    let msg = 'Correo o contraseña incorrectos.';
    if (c.startsWith('TOO_MANY_ATTEMPTS')) msg = 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
    else if (c.startsWith('USER_DISABLED')) msg = 'Esta cuenta está deshabilitada.';
    else if (c.startsWith('INVALID_EMAIL')) msg = 'El correo no es válido.';
    return { ok: false, msg };
  }
  session = { refresh: d.refreshToken, email };
  try { localStorage.removeItem('qrsession'); sessionStorage.removeItem('qrsession'); (remember ? localStorage : sessionStorage).setItem('qrsession', JSON.stringify(session)) } catch (e) {}
  return { ok: true };
}
function logout(note) {
  session = null;
  try { localStorage.removeItem('qrsession'); sessionStorage.removeItem('qrsession') } catch (e) {}
  loginView(); if (note) toast(note, true);
}
async function writeLink(code, obj) {
  try {
    const t = await idToken();
    const r = await fetch(DB + '/links/' + code + '.json?auth=' + t, { method: obj ? 'PUT' : 'DELETE', body: obj ? JSON.stringify(obj) : undefined });
    return r.ok;
  } catch (e) { return false }
}

/* ---------- redirección pública (lo que ve quien escanea) ---------- */
async function redirect(code) {
  app.innerHTML = '<div class="center"><div><div class="spin"></div><h2>Abriendo…</h2></div></div>';
  let l = null;
  try { if (okCode(code)) l = await (await fetch(DB + '/links/' + code + '.json')).json() } catch (e) {}
  if (!l || !okUrl(l.url)) {
    app.innerHTML = '<div class="center"><div><div class="brand" style="margin:0 auto 16px">' + LOGO + '</div><h1>Código no disponible</h1><p class="sub">Este QR ya no está activo.</p></div></div>';
    return;
  }
  const count = fetch(DB + '/scans/' + code + '.json', {
    method: 'PUT', keepalive: true, body: JSON.stringify({ '.sv': { increment: 1 } })
  }).catch(() => {});
  await Promise.race([count, new Promise(r => setTimeout(r, 900))]);
  location.replace(l.url);
}

/* ---------- login ---------- */
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function loginView() {
  app.innerHTML = '<div class="login"><div class="brand">' + LOGO + '</div><h1>Panel de QR</h1><p class="sub">Inicia sesión para administrar tus códigos</p>' +
    '<form class="box" id="f" novalidate><div class="field"><label for="e">Correo</label><input id="e" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="tucorreo@gmail.com" maxlength="120" aria-describedby="ee"><div class="err" id="ee" role="alert"></div></div>' +
    '<div class="field"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••" maxlength="100" aria-describedby="pe"><div class="err" id="pe" role="alert"></div><div class="err warn" id="cl" style="display:none">Tienes las mayúsculas activadas (Bloq Mayús).</div></div>' +
    '<label class="chk"><input type="checkbox" id="sp"> Mostrar contraseña</label>' +
    '<label class="chk"><input type="checkbox" id="rm" checked> Recordarme en este equipo</label>' +
    '<div class="err" id="fe" role="alert" style="margin-bottom:8px"></div>' +
    '<button class="btn pri block" id="go" type="submit">Entrar</button></form></div>';
  const g = id => document.getElementById(id);
  const setErr = (id, m, inp) => { g(id).textContent = m; if (inp) { g(inp).classList.toggle('bad', !!m); g(inp).setAttribute('aria-invalid', m ? 'true' : 'false') } };
  g('sp').onchange = ev => { g('p').type = ev.target.checked ? 'text' : 'password' };
  g('e').oninput = () => { setErr('ee', '', 'e'); setErr('fe', '') };
  g('p').oninput = () => { setErr('pe', '', 'p'); setErr('fe', '') };
  const caps = ev => { g('cl').style.display = ev.getModifierState && ev.getModifierState('CapsLock') ? 'block' : 'none' };
  g('p').onkeyup = caps; g('p').onkeydown = caps; g('p').onblur = () => { g('cl').style.display = 'none' };
  g('e').onblur = () => { const v = g('e').value.trim(); if (v && !emailOk(v)) setErr('ee', 'Escribe un correo válido, por ejemplo nombre@gmail.com', 'e') };
  g('f').onsubmit = async ev => {
    ev.preventDefault();
    if (g('go').disabled) return;
    const email = g('e').value.trim().toLowerCase(), pw = g('p').value;
    let bad = null;
    if (!email) { setErr('ee', 'Escribe tu correo', 'e'); bad = 'e' }
    else if (!emailOk(email)) { setErr('ee', 'Escribe un correo válido, por ejemplo nombre@gmail.com', 'e'); bad = 'e' }
    if (!pw) { setErr('pe', 'Escribe tu contraseña', 'p'); bad = bad || 'p' }
    else if (pw.length < 6) { setErr('pe', 'La contraseña debe tener al menos 6 caracteres', 'p'); bad = bad || 'p' }
    if (bad) { g(bad).focus(); return }
    g('go').disabled = true; g('go').textContent = 'Entrando…';
    const r = await login(email, pw, g('rm').checked);
    if (r.ok) { panel(); return }
    g('go').disabled = false; g('go').textContent = 'Entrar';
    setErr('fe', r.msg); g('p').value = ''; g('p').focus();
  };
}

/* ---------- panel ---------- */
async function panel() {
  app.innerHTML = '<div class="load"><div><div class="spin"></div><p class="sub">Cargando tus QR…</p></div></div>';
  let t; try { t = await idToken() } catch (e) { logout('Tu sesión venció, entra de nuevo'); return }
  let links = [], scans = {};
  try {
    const o = (await (await fetch(DB + '/links.json?auth=' + t)).json()) || {};
    if (o.error) throw new Error(o.error);
    links = Object.keys(o).map(k => ({ code: k, name: o[k].name, url: o[k].url })).sort((a, b) => a.name.localeCompare(b.name));
    const s = (await (await fetch(DB + '/scans.json?auth=' + t)).json()) || {};
    if (!s.error) scans = s;
  } catch (e) { app.innerHTML = '<div class="center"><p>No se pudo cargar. Revisa tu conexión y recarga.</p></div>'; return }
  const total = links.reduce((a, l) => a + (scans[l.code] || 0), 0);

  let h = '<div class="top"><div><h1>Mis QR</h1><p class="sub">' + esc(session.email) + '</p></div><button class="btn sm" id="out">Salir</button></div>' +
    '<div class="stats"><div class="stat"><b>' + links.length + '</b><span>QR creados</span></div><div class="stat"><b>' + total + '</b><span>Escaneos totales</span></div></div>' +
    '<button class="btn pri block" id="tg">+ Nuevo QR</button>' +
    '<div class="card" id="nf" style="display:none;margin-top:14px"><h2 style="margin-bottom:14px">Nuevo QR</h2>' +
    '<div class="field"><label>Negocio (a quién pertenece)</label><input id="nn" placeholder="Ej. Café Luna"></div>' +
    '<p class="sub" style="margin:-4px 0 14px;font-size:13px">El ID del QR se asigna solo, en secuencia (11, 12, 13…).</p>' +
    '<div class="field"><label>Enlace de destino</label><input id="nu" inputmode="url" placeholder="https://search.google.com/local/writereview?placeid=…"></div>' +
    '<button class="btn pri block" id="add">Crear QR</button></div>';
  h += '<div class="bar"><h2>Tus códigos</h2></div>';
  if (!links.length) h += '<div class="empty">Aún no tienes QR.<br>Toca «Nuevo QR» para crear el primero.</div>';
  links.forEach((l, i) => {
    h += '<div class="card"><div class="chead"><div class="av">' + esc((l.name || '?').charAt(0).toUpperCase()) + '</div><div><h2>' + esc(l.name) + '</h2><span class="id">ID: ' + esc(l.code) + '</span></div><span class="pill">' + (scans[l.code] || 0) + ' escaneos</span></div>' +
      '<div class="qrlink"><span>Enlace del QR (el ID forma parte del enlace)</span>' + esc(base) + '?c=<mark>' + esc(l.code) + '</mark></div>' +
      '<div class="field"><label>Negocio dueño de esta placa</label><input data-n="' + i + '" value="' + esc(l.name) + '"><small>Si el negocio ya no la quiere, cambia aquí el nombre y abajo el destino para dársela a otro. El QR impreso sigue igual.</small></div>' +
      '<div class="dest"><div class="field" style="margin:0"><label>Enlace de destino (a dónde lleva el QR)</label><input data-u="' + i + '" inputmode="url" value="' + esc(l.url) + '"></div></div>' +
      '<div class="acts"><button class="btn pri grow" data-save="' + i + '">Guardar cambios</button><button class="btn grow" data-qr="' + i + '">Ver QR</button><button class="btn dg" data-del="' + i + '">Borrar</button></div></div>';
  });
  app.innerHTML = h;
  const g = id => document.getElementById(id);
  g('out').onclick = () => logout();
  g('tg').onclick = () => { const f = g('nf'); f.style.display = f.style.display === 'none' ? 'block' : 'none'; if (f.style.display === 'block') g('nn').focus() };
  g('add').onclick = async () => {
    const name = g('nn').value.trim(), url = g('nu').value.trim();
    if (!name) return toast('Escribe el nombre del negocio', true);
    if (!okUrl(url)) return toast('El enlace debe empezar con https://', true);
    g('add').disabled = true;
    let c = 0;
    try { const r = await (await fetch(DB + '/counter.json?auth=' + t)).json(); if (typeof r === 'number') c = r } catch (e) {}
    const maxId = Math.max(10, ...links.map(x => /^\d+$/.test(x.code) ? +x.code : 0));
    const n = Math.max(c, maxId) + 1, code = String(n);
    if (await writeLink(code, { name, url })) {
      try { await fetch(DB + '/counter.json?auth=' + t, { method: 'PUT', body: String(n) }) } catch (e) {}
      toast('QR creado con ID ' + code); panel();
    } else { g('add').disabled = false; toast('No se pudo guardar', true) }
  };
  app.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.save, l = links[i];
    const name = app.querySelector('[data-n="' + i + '"]').value.trim(), url = app.querySelector('[data-u="' + i + '"]').value.trim();
    if (!name) return toast('El nombre no puede quedar vacío', true);
    if (!okUrl(url)) return toast('El enlace debe empezar con https://', true);
    b.disabled = true;
    if (await writeLink(l.code, { name, url })) { toast('Cambios guardados'); panel() } else { b.disabled = false; toast('No se pudo guardar', true) }
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const l = links[+b.dataset.del];
    if (!confirm('¿Borrar «' + l.name + '»? Los QR ya impresos dejarán de funcionar.')) return;
    if (await writeLink(l.code, null)) { toast('QR borrado'); panel() } else toast('No se pudo borrar', true);
  });
  app.querySelectorAll('[data-qr]').forEach(b => b.onclick = () => showQr(links[+b.dataset.qr]));
}

function qrSvg(q, code, cell, mg) {
  const n = q.getModuleCount(), size = (n + mg * 2) * cell, band = cell * 4, H = size + band;
  let d = '';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) d += 'M' + ((k + mg) * cell) + ' ' + ((r + mg) * cell) + 'h' + cell + 'v' + cell + 'h-' + cell + 'z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + H + '" width="' + size + '" height="' + H + '"><rect width="100%" height="100%" fill="#fff"/>' +
    '<path d="' + d + '" fill="#000" shape-rendering="crispEdges"/>' +
    '<text x="' + (size / 2) + '" y="' + (size + band * 0.5) + '" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="' + (cell * 2.2) + '" fill="#9a9a9a">[' + esc(code) + ']</text></svg>';
}

function showQr(l) {
  const q = qrcode(0, 'M'); q.addData(qrUrl(l)); q.make();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="sheet"><h2>' + esc(l.name) + '</h2><div class="qrbox">' + qrSvg(q, l.code, 6, 4) + '</div><div class="url"><b>Destino:</b> ' + esc(l.url) + '</div>' +
    '<div class="row2"><button class="btn sm" id="ds">SVG</button><button class="btn pri sm" id="dp">Descargar PNG</button></div>' +
    '<div class="row2" style="margin-top:8px"><button class="btn sm" id="cp">Copiar destino</button><button class="btn sm" id="cl">Cerrar</button></div></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close() };
  m.querySelector('#cl').onclick = close;
  m.querySelector('#cp').onclick = () => { navigator.clipboard.writeText(l.url).then(() => toast('Enlace de destino copiado'), () => toast('No se pudo copiar', true)) };
  const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click() };
  m.querySelector('#ds').onclick = () => save(new Blob([qrSvg(q, l.code, 10, 4)], { type: 'image/svg+xml' }), l.code + '.svg');
  m.querySelector('#dp').onclick = () => {
    const n = q.getModuleCount(), cs = 40, mg = 4, size = (n + mg * 2) * cs, band = cs * 4, c = document.createElement('canvas');
    c.width = size; c.height = size + band;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + mg) * cs, (r + mg) * cs, cs, cs);
    x.fillStyle = '#9a9a9a'; x.font = Math.round(cs * 2.2) + 'px Arial, Helvetica, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('[' + l.code + ']', size / 2, size + band / 2);
    c.toBlob(b => save(b, l.code + '.png'), 'image/png');
  };
}

const code = new URLSearchParams(location.search).get('c');
if (code) redirect(code); else if (session) panel(); else loginView();
</script>
</body>
